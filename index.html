<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shard Dominion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #050510;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #e2e8f0;
        font-family: "Share Tech Mono", monospace;
      }
      #game-container {
        text-align: center;
        max-width: 100vw;
      }
      /* The canvas renders at a fixed 800×600 backing store but scales to fit the
         viewport (aspect preserved). Input maps CSS→backing coords, so clicks stay
         correct at any display size. */
      #game-canvas {
        border: 1px solid #333;
        background: #000;
        display: block;
        margin: 0 auto;
        /* Fill the viewport (QA: the game rendered at a small fixed 800px until the
           window was resized). Input maps CSS→backing coords, so clicks stay exact. */
        width: min(100vw, calc(100vh * 4 / 3 - 40px));
        max-width: 100vw;
        max-height: calc(100vh - 30px);
        aspect-ratio: 4 / 3;
        outline: none;
        image-rendering: pixelated;
        touch-action: none;
      }
      .status {
        margin-top: 10px;
        font-size: 12px;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game-canvas" tabindex="0"></canvas>
      <div class="status">Shard Dominion — choose Campaign or Skirmish · T/R train · right-click move · destroy the enemy to win</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
